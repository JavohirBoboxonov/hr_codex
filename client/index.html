    <!-- ═══════════════════ Yandex Webmaster verification ═══════════════════
         Steps to get this token:
         1. Go to https://webmaster.yandex.com/
         2. Add site → https://hrlodex.uz
         3. Choose "Meta tag" verification method

    <!-- ═══════════════════ Structured Data: Organization + WebSite ═══════════════════ -->

    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://hrlodex.uz/#organization",
          "name": "HR LODEX",
          "url": "https://hrlodex.uz",
          "logo": {
            "@type": "ImageObject",
            "url": "https://hrlodex.uz/og-image.png",
            "width": 1200,
            "height": 630
          },
          "sameAs": [],
          "description": "O'zbekistondagi yetakchi sun'iy intellekt asosidagi HR intervyu platformasi"
        },
        {
          "@type": "WebSite",
          "@id": "https://hrlodex.uz/#website",
          "url": "https://hrlodex.uz",
          "name": "HR LODEX",
          "publisher": { "@id": "https://hrlodex.uz/#organization" },
          "inLanguage": ["uz", "ru", "en"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://hrlodex.uz/jobs?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SoftwareApplication",

          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://hrlodex.uz",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "UZS",
            "availability": "https://schema.org/InStock"
          },

        }
      ]
    }
    </script>

    <!-- ═══════════════════ Google Analytics 4 ═══════════════════
         Steps to get your Measurement ID (G-XXXXXXXXXX):
         1. Go to https://analytics.google.com/
         2. Create account → Create Property → Web
         3. Enter https://hrlodex.uz as the website URL
         4. Copy the Measurement ID (starts with G-)
         5. Set VITE_GA_ID=G-XXXXXXXXXX in .env
    ══════════════════════════════════════════════════════════════ -->
    <!-- GA4 is injected at build time via env var; script is omitted if VITE_GA_ID is not set -->

    <!-- ═══════════════════ Yandex Metrica ═══════════════════
         Steps to get your Counter ID:
         1. Go to https://metrica.yandex.com/
         2. Add counter → enter https://hrlodex.uz
         3. Copy the 8-digit counter ID
         4. Set VITE_YM_ID=XXXXXXXX in .env
    ══════════════════════════════════════════════════════════════ -->
    <!-- Yandex Metrica is injected at build time via env var; script is omitted if VITE_YM_ID is not set -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for better look in dark mode */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
        }
    </style>
<script>
        // Dark mode ni darhol qo'llash (FOUC ni oldini olish uchun)
        (function() {
            try {
                const saved = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = saved === 'dark' || (!saved && prefersDark);
                
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {
                // Ignore errors
            }
        })();
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300">

    </div>
